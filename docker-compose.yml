version: '3.8'

services:
  gcc-atlas:
    build: .
    image: gcc-atlas:latest
    container_name: gcc-atlas
    ports:
      - "8000:8000"
    environment:
      - GCC_ATLAS_DB=/data/gcc_atlas.sqlite
    volumes:
      - gcc-atlas-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gcc-atlas-data:
